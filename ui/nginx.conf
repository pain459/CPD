server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_buffering off;  # SSE /events must flush immediately
    proxy_cache off;
    proxy_read_timeout 300s;
  }
  location / {
    try_files $uri /index.html;
  }
}
